<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Momo+Trust+Display&display=swap"
        rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <title>contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <header>
        <nav>
            <div class="navbar">
                <img class="logo" src="/Website/images/Designer.png">
                <a href="home.html">HOME</a>
                <a href="handleiding.html">HANDLEIDING</a>
                <a class="active" href="contact.html">CONTACT</a>
            </div>
        </nav>
    </header>
    <main class="contactPage">
        <section class="main-box contactBlock" id="formPic">
            <img src="/Website/images/Designer.png" alt="Mooie foto">
        </section>
        <section class="main-box contactBlock main-form" id="magicPic">
            <img id="logoMobile" src="/Website/images/Designer.png" alt="Mooie foto">
            <section class="intro">
                <h1>Heeft u een vraag?</h1>
                <p>Stel hem via het onderstaande contactformulier. <br> En we komen zsm bij u terug!</p>
            </section>
            <section>
                <form class="contactForm" action="">
                    <div class="fnLn">
                        <div class="inputBox">
                            <label for="first-name">Voornaam</label>
                            <input type="text" name="first-name" id="first-name">
                        </div>
                        <div class="inputBox">
                            <label for="last-name">Achternaam</label>
                            <input type="text" name="last-name" id="last-name">
                        </div>
                    </div>
                    <div class="mailPhone">
                        <div class="inputBox">
                            <label for="e-mail">E-mail</label>
                            <input type="text" name="e-mail" id="e-mail">
                        </div>
                        <div class="inputBox">
                            <label for="phone-number">Telefoonnummer</label>
                            <input type="number" name="phone-number" id="phone-number">
                        </div>
                    </div>
                    <div class="questionInput">
                        <label for="question">Uw vraag</label>
                        <textarea name="question" id="question" rows="4"></textarea>
                        <button type="submit">Verzenden</button>
                    </div>
                </form>
            </section>
        </section>
    </main>
    <section class="freqQuest">
        <details>
            <summary class="accordion">Question 1</summary>
            <div class="panel">
                <p>joehoe</p>
            </div>
        </details>
        <details>
            <summary class="accordion">Question 2</summary>
            <div class="panel">
                <p>joehoe 2</p>
            </div>
        </details>
        <details>
            <summary class="accordion">Question 3</summary>
            <div class="panel">
                <p>joehoe 3</p>
            </div>
        </details>
    </section>
    <footer>

    </footer>
</body>

</html>
