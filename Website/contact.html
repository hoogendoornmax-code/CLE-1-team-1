<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Momo+Trust+Display&display=swap"
        rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <title>contact</title>
</head>

<body>
    <header>
        <nav>
            <div class="navbar">
                <img class="logo"
                    src="https://i.etsystatic.com/41769818/r/il/eb8615/5492481111/il_570xN.5492481111_mygn.jpg">
                <a href="home.html">HOME</a>
                <a href="handleiding.html">HANDLEIDING</a>
                <a class="active" href="contact.html">CONTACT</a>
            </div>
        </nav>
    </header>
    <main>
        <section class="intro">
            <h1>Heeft u een vraag?</h1>
            <p>Stel hem via het onderstaande contactformulier. <br> En we komen zsm bij u terug!</p>
        </section>
        <section>
            <form class="contactForm" action="">
                <div class="fnLn">
                    <div class="inputBox">
                        <label for="first-name">Voornaam</label>
                        <input type="text" name="first-name" id="first-name">
                    </div>
                    <div class="inputBox">
                        <label for="last-name">Achternaam</label>
                        <input type="text" name="last-name" id="last-name">
                    </div>
                </div>
                <div class="mailPhone">
                    <div class="inputBox">
                        <label for="e-mail">E-mail</label>
                        <input type="text" name="e-mail" id="e-mail">
                    </div>
                    <div class="inputBox">
                        <label for="phone-number">Telefoonnummer</label>
                        <input type="number" name="phone-number" id="phone-number">
                    </div>
                </div>
                <div class="questionInput">
                    <label for="question">Uw vraag</label>
                    <textarea name="question" id="question" rows="4"></textarea>
                    <button type="submit">Verzenden</button>
                </div>
            </form>
        </section>
        <footer>

        </footer>
    </main>
</body>

</html>
